---
# Internal values. Not meant to be overridden.

__mde_linux_config_dir: /etc/opt/microsoft/mdatp
__mde_linux_onboarding_path: "{{ __mde_linux_config_dir }}/mdatp_onboard.json"
__mde_linux_offboarding_path: "{{ __mde_linux_config_dir }}/mdatp_offboard.json"
__mde_linux_managed_config_path: "{{ __mde_linux_config_dir }}/managed/mdatp_managed.json"

__mde_linux_data_dirs:
  - /etc/opt/microsoft/mdatp
  - /var/opt/microsoft/mdatp
  - /var/log/microsoft/mdatp

# The only tag key Microsoft supports in the managed configuration profile.
__mde_linux_supported_tag_keys:
  - GROUP

__mde_linux_supported_os_families:
  - RedHat
  - Debian
  - Suse

__mde_linux_supported_architectures:
  - x86_64
  - aarch64

# Microsoft's signing keys for packages.microsoft.com. Repositories for RHEL 10, SLES 16,
# Debian 13, Ubuntu 26.04 and newer Fedora are signed with the 2025 key, older ones with the
# original key. Both are installed so one definition works everywhere.
__mde_linux_gpg_keys:
  - file: microsoft.asc
    fingerprint: BC528686B50D79E339D3721CEB3E94ADBE1229CF
  - file: microsoft-2025.asc
    fingerprint: AA86F75E427A19DD33346403EE4D7792F748182B
__mde_linux_rpm_key_dir: /etc/pki/rpm-gpg
__mde_linux_apt_keyring: /usr/share/keyrings/microsoft-prod.gpg

__mde_linux_repo_channel: "{{ mde_linux_channel }}"
__mde_linux_rpm_repo_dir: "{{ '/etc/zypp/repos.d' if ansible_facts['pkg_mgr'] == 'zypper' else '/etc/yum.repos.d' }}"
__mde_linux_rpm_repo_names:
  prod: Microsoft Production
  insiders-slow: Microsoft Insiders-Slow
  insiders-fast: Microsoft Insiders-Fast

# packages.microsoft.com path for this host, the same mapping Microsoft's mde_installer.sh
# uses. Rocky, Alma, Oracle and CentOS Stream use the RHEL repositories. Fedora before 43
# uses rhel/8.
__mde_linux_detected_repository_path: >-
  {%- set distribution = ansible_facts['distribution'] -%}
  {%- set major = ansible_facts['distribution_major_version'] -%}
  {%- if ansible_facts['os_family'] == 'Debian' -%}
  {{ 'ubuntu/' ~ ansible_facts['distribution_version'] if distribution == 'Ubuntu' else 'debian/' ~ major }}
  {%- elif ansible_facts['os_family'] == 'Suse' -%}
  sles/{{ major }}
  {%- elif distribution == 'Amazon' -%}
  amazonlinux/{{ major }}
  {%- elif distribution == 'Fedora' -%}
  {{ 'fedora/' ~ major if (major | int) >= 43 else 'rhel/8' }}
  {%- else -%}
  rhel/{{ major }}
  {%- endif -%}
__mde_linux_repository_path: "{{ mde_linux_repository_path | default('', true) or __mde_linux_detected_repository_path }}"

# Package name with an optional version, in the syntax of the host's package manager.
__mde_linux_package: >-
  {{ 'mdatp' if not mde_linux_version
     else ('mdatp=' ~ mde_linux_version if ansible_facts['pkg_mgr'] == 'apt' else 'mdatp-' ~ mde_linux_version) }}
