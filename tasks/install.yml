---
# Read what is installed first: the RPM or dpkg database, which needs no repository. When mdatp is
# already there at the version asked for, the package manager is not called at all. That is what
# lets the role run on a host whose repositories are out of reach, after
# libre_devops.standalone_package_installer pushed the package: dnf loads the metadata of every
# enabled repository on every call, even for a package that is installed, and apt's cache refresh
# fails the same way. latest still asks the package manager, because it needs a repository.
- name: Read the installed packages
  ansible.builtin.package_facts:
    manager: auto
  when: not __mde_linux_el7 | bool

- name: Read the installed mdatp version (RHEL 7)
  ansible.builtin.command:
    argv: [rpm, -q, --queryformat, "%{VERSION}\n", mdatp]
  register: __mde_linux_rpm_query
  changed_when: false
  failed_when: false
  check_mode: false
  when: __mde_linux_el7 | bool

- name: Work out whether the package manager is needed
  ansible.builtin.set_fact:
    __mde_linux_installed_versions: "{{ __mde_linux_installed }}"
    __mde_linux_package_needed: >-
      {{ mde_linux_package_state != 'present'
         or __mde_linux_installed | length == 0
         or (mde_linux_version | length > 0 and mde_linux_version not in __mde_linux_installed) }}
  vars:
    __mde_linux_installed: >-
      {{ ((__mde_linux_rpm_query.stdout_lines if __mde_linux_rpm_query.rc == 0 else [])
          if __mde_linux_el7 | bool
          else (ansible_facts['packages']['mdatp'] | default([]) | map(attribute='version') | list)) }}

# Refresh straight away after the source list changed, otherwise when older than an hour.
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (__mde_linux_apt_source | default({}) is changed) else 3600 }}"
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - __mde_linux_package_needed | bool

- name: Install the mdatp package
  ansible.builtin.package:
    name: "{{ __mde_linux_package }}"
    state: "{{ mde_linux_package_state }}"
  when:
    - __mde_linux_package_needed | bool
    - not __mde_linux_el7 | bool

# yum install of a named version also updates to it; latest with no version asks for an update.
- name: Install the mdatp package (yum, RHEL 7)  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: >-
      {{ ['yum', '-y']
         + (['update', 'mdatp']
            if mde_linux_package_state == 'latest' and not mde_linux_version and __mde_linux_installed_versions | length > 0
            else ['install', __mde_linux_package]) }}
  register: __mde_linux_yum
  changed_when: >-
    'Nothing to do' not in __mde_linux_yum.stdout
    and 'No packages marked for update' not in __mde_linux_yum.stdout
  when:
    - __mde_linux_package_needed | bool
    - __mde_linux_el7 | bool
