---
# Microsoft's manual uninstall: apt-get purge on Debian and Ubuntu, a package removal
# elsewhere. The repository stays unless mde_linux_remove_repository is true, because other
# Microsoft agents (the Azure Arc agent, for example) use the same one.

- name: Purge the mdatp package
  ansible.builtin.apt:
    name: mdatp
    state: absent
    purge: true
  when: ansible_facts['pkg_mgr'] == 'apt'

# No repository is needed to remove a package, and dnf and yum would otherwise load every enabled
# repository's metadata first, failing on a host that reaches none (such as one whose package came
# from libre_devops.standalone_package_installer).
- name: Remove the mdatp package (dnf)
  ansible.builtin.package:
    name: mdatp
    state: absent
    disablerepo: "*"
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

- name: Remove the mdatp package
  ansible.builtin.package:
    name: mdatp
    state: absent
  when:
    - ansible_facts['pkg_mgr'] not in ['apt', 'dnf', 'dnf5']
    - not __mde_linux_el7 | bool

- name: Remove the mdatp package (yum, RHEL 7)  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [yum, -y, --disablerepo=*, remove, mdatp]
  register: __mde_linux_yum_remove
  changed_when: "'No Packages marked for removal' not in __mde_linux_yum_remove.stdout"
  when: __mde_linux_el7 | bool

- name: Delete the agent's configuration, data and logs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ __mde_linux_data_dirs }}"
  when: mde_linux_remove_data | bool

- name: Remove the repository definition
  ansible.builtin.file:
    path: >-
      {{ '/etc/apt/sources.list.d/microsoft-' ~ __mde_linux_repo_channel ~ '.list'
         if ansible_facts['pkg_mgr'] == 'apt'
         else __mde_linux_rpm_repo_dir ~ '/microsoft-' ~ __mde_linux_repo_channel ~ '.repo' }}
    state: absent
  when:
    - mde_linux_manage_repository | bool
    - mde_linux_remove_repository | bool
