---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the installed packages
      ansible.builtin.package_facts:

    - name: Check mdatp is installed
      ansible.builtin.assert:
        that:
          - "'mdatp' in ansible_facts.packages"
        quiet: true

    - name: Read the mdatp service state
      ansible.builtin.systemd_service:
        name: mdatp
      register: __verify_mdatp_service

    - name: Check mdatp is enabled at boot
      ansible.builtin.assert:
        that:
          - __verify_mdatp_service.status.UnitFileState == 'enabled'
        quiet: true

    - name: Check the RPM repository and keys
      when: ansible_facts['pkg_mgr'] != 'apt'
      block:
        - name: Read the repository definition
          ansible.builtin.slurp:
            src: "{{ '/etc/zypp/repos.d' if ansible_facts['pkg_mgr'] == 'zypper' else '/etc/yum.repos.d' }}/microsoft-prod.repo"
          register: __verify_repo

        - name: Check the repository points at packages.microsoft.com with signature checks on
          ansible.builtin.assert:
            that:
              - "'[packages-microsoft-com-prod]' in __verify_repo.content | b64decode"
              - "'baseurl=https://packages.microsoft.com/' in __verify_repo.content | b64decode"
              - "'gpgcheck=1' in __verify_repo.content | b64decode"
              - "'repo_gpgcheck=1' in __verify_repo.content | b64decode"
            quiet: true

        # rpm_key can import and remove keys but not list them, so query rpm directly.
        - name: List the imported signing keys  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: rpm -q gpg-pubkey --qf '%{VERSION}\n'
          register: __verify_keys
          changed_when: false

        - name: Check both Microsoft keys are imported
          ansible.builtin.assert:
            that:
              - "'be1229cf' in __verify_keys.stdout_lines"
              - "'f748182b' in __verify_keys.stdout_lines"
            quiet: true

    - name: Check the apt source and keyring
      when: ansible_facts['pkg_mgr'] == 'apt'
      block:
        - name: Read the source list
          ansible.builtin.slurp:
            src: /etc/apt/sources.list.d/microsoft-prod.list
          register: __verify_list

        - name: Check the source uses the Microsoft keyring
          ansible.builtin.assert:
            that:
              - "'signed-by=/usr/share/keyrings/microsoft-prod.gpg' in __verify_list.content | b64decode"
              - "(ansible_facts['distribution_release'] ~ ' main') in __verify_list.content | b64decode"
            quiet: true

        - name: Read the keyring
          ansible.builtin.stat:
            path: /usr/share/keyrings/microsoft-prod.gpg
          register: __verify_keyring

        - name: Check the keyring is readable by apt
          ansible.builtin.assert:
            that:
              - __verify_keyring.stat.exists
              - __verify_keyring.stat.mode == '0644'
            quiet: true

    - name: Read mdatp_managed.json
      ansible.builtin.slurp:
        src: /etc/opt/microsoft/mdatp/managed/mdatp_managed.json
      register: __verify_managed

    - name: Check the managed configuration was written as given
      ansible.builtin.assert:
        that:
          - (__verify_managed.content | b64decode | from_json).antivirusEngine.enforcementLevel == 'real_time'
          - (__verify_managed.content | b64decode | from_json).edr.tags[0].value == 'molecule'
        quiet: true

    - name: Read the onboarding package
      ansible.builtin.stat:
        path: /etc/opt/microsoft/mdatp/mdatp_onboard.json
      register: __verify_onboard

    - name: Check the onboarding package is in place and private
      ansible.builtin.assert:
        that:
          - __verify_onboard.stat.exists
          - __verify_onboard.stat.mode == '0600'
          - __verify_onboard.stat.pw_name == 'root'
        quiet: true
