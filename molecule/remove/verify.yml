---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the installed packages
      ansible.builtin.package_facts:

    - name: Check mdatp is gone
      ansible.builtin.assert:
        that:
          - "'mdatp' not in ansible_facts.packages"
        quiet: true

    - name: Look for anything left behind
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __verify_leftovers
      loop:
        - /etc/opt/microsoft/mdatp
        - /var/opt/microsoft/mdatp
        - /var/log/microsoft/mdatp
        - /etc/apt/sources.list.d/microsoft-prod.list
        - /etc/yum.repos.d/microsoft-prod.repo
        - /etc/zypp/repos.d/microsoft-prod.repo

    - name: Check nothing is left behind
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} still exists"
        quiet: true
      loop: "{{ __verify_leftovers.results }}"
      loop_control:
        label: "{{ item.item }}"
