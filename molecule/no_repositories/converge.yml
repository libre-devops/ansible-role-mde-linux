---
- name: Install the agent without onboarding
  hosts: all
  become: true
  vars:
    mde_linux_onboard: false
  roles:
    - role: libre_devops.mde_linux

# A proxy on a port nothing listens on, and no cached metadata: every repository download is
# refused, as on a host with no route out. The cached metadata has to go too, or dnf and apt would
# not need the network at all.
- name: Make every package repository unreachable
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Send dnf through a proxy that refuses connections
      community.general.ini_file:
        path: /etc/dnf/dnf.conf
        section: main
        option: proxy
        value: http://127.0.0.1:9
        mode: "0644"
      when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

    - name: Drop dnf's cached metadata
      ansible.builtin.command: dnf clean all
      changed_when: true
      when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

    - name: Send apt through a proxy that refuses connections
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-no-repositories
        content: |
          Acquire::http::Proxy "http://127.0.0.1:9";
          Acquire::https::Proxy "http://127.0.0.1:9";
        mode: "0644"
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Drop apt's package lists
      ansible.builtin.shell: rm -rf /var/lib/apt/lists/* && apt-get clean
      changed_when: true
      when: ansible_facts['pkg_mgr'] == 'apt'

- name: Run the role again with no repository in reach
  hosts: all
  become: true
  vars:
    mde_linux_manage_repository: false
    mde_linux_onboard: false
  roles:
    - role: libre_devops.mde_linux
